[package]
name = "gitspy-app"
version = "1.2.2"
description = "gitspy, a desktop git client: the Tauri application"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
semver = "1"
tokio = { version = "1", features = ["time"] }
ignore = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gitspy-core = { path = "../crates/gitspy-core" }
gitspy-repo = { path = "../crates/gitspy-repo" }
ts-rs = "12.0.1"
gitspy-exec = { version = "0.1.0", path = "../crates/gitspy-exec" }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
futures-util = { version = "0.3", default-features = false }
gitspy-hosts = { version = "0.1.0", path = "../crates/gitspy-hosts" }
gitspy-ai = { version = "0.1.0", path = "../crates/gitspy-ai" }
gitspy-term = { version = "0.1.0", path = "../crates/gitspy-term" }

[dev-dependencies]
tempfile = "3"
