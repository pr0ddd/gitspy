<!-- @dsCard group="Pages" name="Working tree" subtitle="WIP row selected: unstaged, staged, commit box" -->
<div class="bg-surface text-foreground flex h-[820px] flex-col font-sans">
  {{> icons}}
  {{> tabs}}
  {{> toolbar}}
  <div class="flex min-h-0 flex-1">
    {{> sidebar}}
    <div class="flex min-h-0 min-w-0 flex-1 flex-col">
      {{> graph}}
    </div>
    <aside class="bg-card border-border flex w-80 shrink-0 flex-col border-l">
      <header class="border-border flex h-9 shrink-0 items-center gap-2 border-b px-3">
        <span class="text-muted-foreground text-xs tracking-wide uppercase">Working tree</span>
        <span class="bg-ref-local ml-auto rounded-sm px-1.5 py-0.5 text-2xs text-white">master</span>
      </header>

      <div class="border-border flex h-7 shrink-0 items-center gap-2 border-b px-3">
        <span class="rotate-90 text-xs">›</span>
        <span class="text-muted-foreground flex-1 text-xs tracking-wide uppercase">Unstaged</span>
        <span class="text-muted-foreground tabular-nums">2</span>
        <button class="border-input hover:bg-surface-hover h-5 rounded-md border px-1.5 text-2xs">Stage all</button>
      </div>
      <div class="p-1 font-mono text-xs">
        <div class="hover:bg-surface-hover group flex h-6 items-center gap-2 rounded-sm px-2"><span class="text-modified w-3">✎</span><span class="flex-1 truncate">CLAUDE.md</span><span class="text-muted-foreground opacity-0 group-hover:opacity-100">Stage</span></div>
        <div class="bg-surface-hover flex h-6 items-center gap-2 rounded-sm px-2"><span class="text-added w-3">+</span><span class="flex-1 truncate">design/cards/page-graph.html</span><span class="text-muted-foreground">Stage</span></div>
      </div>

      <div class="border-border flex h-7 shrink-0 items-center gap-2 border-t border-b px-3">
        <span class="rotate-90 text-xs">›</span>
        <span class="text-muted-foreground flex-1 text-xs tracking-wide uppercase">Staged</span>
        <span class="text-muted-foreground tabular-nums">1</span>
      </div>
      <div class="p-1 font-mono text-xs">
        <div class="hover:bg-surface-hover flex h-6 items-center gap-2 rounded-sm px-2"><span class="text-modified w-3">✎</span><span class="flex-1 truncate">src/theme.ts</span></div>
      </div>

      <div class="mt-auto border-border border-t p-3">
        <label class="text-muted-foreground mb-2 flex items-center gap-2"><input type="checkbox" class="accent-primary" />Amend previous commit</label>
        <div class="border-input mb-2 rounded-md border p-2">
          <input placeholder="Сообщение коммита" class="w-full bg-transparent text-sm outline-none" />
          <textarea placeholder="Описание" rows="2" class="text-muted-foreground mt-1 w-full resize-none bg-transparent outline-none"></textarea>
        </div>
        <button class="bg-primary text-primary-foreground h-8 w-full rounded-md text-sm font-medium">Закоммитить 1 файл</button>
      </div>
    </aside>
  </div>
  {{> statusbar}}
</div>
