<!-- @dsCard group="Pages" name="Clone dialog" subtitle="Modal: sources rail, form, not-connected state" -->
<div class="bg-surface text-foreground relative flex h-[820px] flex-col font-sans">
  {{> icons}}
  {{> tabs}}
  <div class="min-h-0 flex-1 overflow-hidden opacity-40">
    <div class="mx-auto w-full max-w-2xl px-8 py-10">
      <h1 class="mb-5 text-xl font-semibold tracking-tight">Репозитории</h1>
      <div class="flex gap-2">
        <div class="bg-primary h-8 w-24 rounded-md"></div><div class="bg-secondary h-8 w-24 rounded-md"></div><div class="bg-secondary h-8 w-24 rounded-md"></div>
      </div>
    </div>
  </div>

  <div class="absolute inset-0 flex items-center justify-center bg-black/60">
    <div class="bg-popover border-border flex h-[480px] w-[760px] flex-col overflow-hidden rounded-lg border shadow-2xl">
      <header class="border-border flex h-11 shrink-0 items-center border-b px-4">
        <h2 class="text-lg font-semibold tracking-tight">Clone</h2>
        <button class="text-muted-foreground hover:text-foreground ml-auto">✕</button>
      </header>
      <div class="flex min-h-0 flex-1">
        <nav class="bg-card border-border w-52 shrink-0 border-r py-1">
          <button class="hover:bg-surface-hover flex h-8 w-full items-center border-l-2 border-transparent px-3">URL</button>
          <button class="bg-primary/15 border-l-primary text-foreground flex h-8 w-full items-center border-l-2 px-3 font-medium">GitHub</button>
          <button class="hover:bg-surface-hover flex h-8 w-full items-center border-l-2 border-transparent px-3">GitLab</button>
          <button class="hover:bg-surface-hover flex h-8 w-full items-center border-l-2 border-transparent px-3">Bitbucket</button>
          <button class="hover:bg-surface-hover flex h-8 w-full items-center border-l-2 border-transparent px-3">Azure DevOps</button>
        </nav>
        <div class="flex min-w-0 flex-1 flex-col p-5">
          <div class="mb-4 grid grid-cols-[140px_1fr] items-center gap-3">
            <label class="text-right">Куда клонировать</label>
            <div class="flex gap-2">
              <input value="/Users/pavelerohovets/projects" class="border-input h-8 flex-1 rounded-md border bg-transparent px-2 font-mono text-xs" />
              <button class="border-input hover:bg-surface-hover h-8 rounded-md border px-3 text-sm">Обзор</button>
            </div>
          </div>
          <div class="mb-4 grid grid-cols-[140px_1fr] items-center gap-3">
            <label class="text-right">Репозиторий</label>
            <input placeholder="Поиск среди ваших репозиториев" class="border-input ring-ring/40 h-8 rounded-md border bg-transparent px-2 text-sm ring-2" />
          </div>
          <div class="border-border bg-card mb-4 ml-[152px] overflow-hidden rounded-md border">
            <div class="text-muted-foreground bg-surface-raised px-2 py-1 text-2xs tracking-wide uppercase">pr0ddd</div>
            <div class="bg-surface-hover flex h-7 items-center gap-2 px-2">AgentsOverflow</div>
            <div class="hover:bg-surface-hover flex h-7 items-center gap-2 px-2">CrimsonNight <span class="text-muted-foreground text-xs">приватный</span></div>
            <div class="hover:bg-surface-hover flex h-7 items-center gap-2 px-2">FluffyBall <span class="text-muted-foreground text-xs">приватный</span></div>
          </div>
          <div class="mt-auto flex items-center gap-4">
            <label class="text-muted-foreground flex items-center gap-2"><input type="checkbox" class="accent-primary" />Shallow clone</label>
            <button class="bg-primary text-primary-foreground ml-auto h-8 rounded-md px-4 text-sm font-medium">Clone</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
