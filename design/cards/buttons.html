<!-- @dsCard group="Controls" name="Button" subtitle="Variants, sizes, disabled with a reason" -->
<div class="bg-surface text-foreground p-6 font-sans">
  <h2 class="mb-1 text-xl font-semibold tracking-tight">Button</h2>
  <p class="text-muted-foreground mb-6">Каноничный shadcn. Нужен другой вид — новый вариант в cva, не класс поверх.</p>

  <h3 class="text-muted-foreground mb-2 text-xs tracking-wide uppercase">Варианты</h3>
  <div class="mb-6 flex flex-wrap items-center gap-2">
    <button class="bg-primary text-primary-foreground hover:bg-primary/90 inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-sm font-medium transition-colors">Open</button>
    <button class="bg-secondary text-secondary-foreground hover:bg-secondary/80 inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-sm font-medium transition-colors">Clone</button>
    <button class="border-input bg-transparent hover:bg-surface-hover inline-flex h-8 items-center gap-1.5 rounded-md border px-3 text-sm font-medium transition-colors">Fetch</button>
    <button class="hover:bg-surface-hover inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-sm font-medium transition-colors">Pull</button>
    <button class="bg-destructive text-white hover:bg-destructive/90 inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-sm font-medium transition-colors">Discard</button>
  </div>

  <h3 class="text-muted-foreground mb-2 text-xs tracking-wide uppercase">Размеры</h3>
  <div class="mb-6 flex items-center gap-2">
    <button class="bg-primary text-primary-foreground inline-flex h-6 items-center rounded-md px-2 text-xs font-medium">sm</button>
    <button class="bg-primary text-primary-foreground inline-flex h-7 items-center rounded-md px-2.5 text-sm font-medium">default</button>
    <button class="bg-primary text-primary-foreground inline-flex h-8 items-center rounded-md px-3 text-sm font-medium">lg</button>
    <button class="bg-primary text-primary-foreground inline-flex size-7 items-center justify-center rounded-md">+</button>
  </div>

  <h3 class="text-muted-foreground mb-2 text-xs tracking-wide uppercase">Выключено с объяснением</h3>
  <div class="flex items-center gap-3">
    <button disabled class="bg-secondary text-secondary-foreground pointer-events-none inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-sm font-medium opacity-50">Push</button>
    <div class="bg-popover text-popover-foreground border-border rounded-md border px-2 py-1 text-xs shadow-md">Появится вместе со слоем операций</div>
  </div>
  <p class="text-muted-foreground/70 mt-2 text-xs">Выключенный элемент обязан объяснять причину: «нет слоя операций» и «нет интеграции» выглядят одинаково, но значат разное.</p>
</div>
