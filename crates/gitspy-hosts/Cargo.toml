[package]
name = "gitspy-hosts"
version = "0.1.0"
description = "GitHub, GitLab and Bitbucket behind one Host enum, for gitspy"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "form", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
